services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_DB: asb_oltp
      POSTGRES_USER: db_user
      POSTGRES_PASSWORD: db_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./00_setup:/docker-entrypoint-initdb.d # Mounts your local script directory

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U db_user -d asb_oltp"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s


  setup-db:
    image: python:3.11-slim
    container_name: setup_db
    working_dir: /app

    environment:
      # DuckDB file created inside the mounted project directory
      DUCKDB_OLTP_CONNECTION: /app/03_duckdb_databases/asb_oltp.duckdb
      DUCKDB_OLAP_CONNECTION: /app/03_duckdb_databases/asb_olap.duckdb

      # Use the Compose service name—not localhost
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB_OLTP: asb_oltp
      POSTGRES_DB_OLAP: asb_olap
      POSTGRES_USER: db_user
      POSTGRES_PASSWORD: db_password

    volumes:
      # Requirements.txt file for Python packages 
      - ./requirements.txt:/app/requirements.txt:ro

      # Map setup_db.py and 00_setup 
      - ./setup_db.py:/app/setup_db.py
      - ./00_setup:/app/00_setup

      # DuckDB databases saved on your computer
      - ./00_setup/03_duckdb_databases:/app/03_duckdb_databases

    command:
      - sh
      - -c
      - |
        pip install -r /app/requirements.txt &&
        python setup_db.py

    depends_on:
      postgres:
        condition: service_healthy

    restart: "no"

  metabase-db:
    image: postgres:16-alpine
    container_name: metabase_db
    restart: always
    environment:
      POSTGRES_DB: metabase
      POSTGRES_USER: metabase_user
      POSTGRES_PASSWORD: metabase_password
    volumes:
      - metabase_data:/var/lib/postgresql/data

  metabase:
    image: metabase/metabase:v0.63.17.x
    container_name: metabase
    restart: always
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: metabase_user
      MB_DB_PASS: metabase_password
      MB_DB_HOST: metabase-db
    depends_on:
      - metabase-db
      - postgres

volumes:
  postgres_data:
  metabase_data: